name: Build iOS App
on:
  workflow_dispatch:

permissions:
  contents: read     # for checkout & reading your code
  actions: read      # to download/upload artifacts

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (debug)
        run: flutter build ios --debug

      - name: Upload build artifacts
        uses: actions/upload-artifact@v2   # or @v2 if v3 really doesn’t exist in your GHE
        with:
          name: ios-debug-build
          path: build/ios/iphoneos/Runner.app
