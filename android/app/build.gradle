// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id "com.android.application"
    id 'com.google.gms.google-services' // Firebase
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.myapplication"
    compileSdk 34  // ✅ FIXED: Removed ".0.1"

    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.myapplication"
        minSdk 23
        targetSdk 34  // ✅ FIXED: Removed ".0.1"
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {  // ✅ ADDED: Ensure debug signing config is present
        debug {
            storeFile file("$rootDir/debug.keystore")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug  // ✅ Ensure this exists
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    // Firebase dependencies (if required)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

